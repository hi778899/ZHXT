services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: cockpit
      POSTGRES_USER: cockpit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
    volumes:
      - cockpit_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cockpit -d cockpit"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      args:
        NODE_BASE_IMAGE: ${NODE_BASE_IMAGE:-node:22-alpine}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 8787
      DATABASE_URL: postgres://cockpit:${POSTGRES_PASSWORD}@db:5432/cockpit
      DATABASE_SSL: ${DATABASE_SSL:-false}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      SESSION_HOURS: ${SESSION_HOURS:-8}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      RESET_TOKEN_MINUTES: ${RESET_TOKEN_MINUTES:-10}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8787}
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-Asia/Shanghai}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-zhangshan}
      INITIAL_ADMIN_NAME: ${INITIAL_ADMIN_NAME:-张珊}
      INITIAL_ADMIN_DEPARTMENT: ${INITIAL_ADMIN_DEPARTMENT:-设备管理部}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?请在 .env 中设置 INITIAL_ADMIN_PASSWORD}
      DEPARTMENT_MANAGER_USERNAME: ${DEPARTMENT_MANAGER_USERNAME:-deptmanager}
      DEPARTMENT_MANAGER_NAME: ${DEPARTMENT_MANAGER_NAME:-部门经理}
      DEPARTMENT_MANAGER_DEPARTMENT: ${DEPARTMENT_MANAGER_DEPARTMENT:-设备管理部}
      DEPARTMENT_MANAGER_PASSWORD: ${DEPARTMENT_MANAGER_PASSWORD:?请在 .env 中设置 DEPARTMENT_MANAGER_PASSWORD}
      ATTENDANCE_SUPERVISOR_USERNAME: ${ATTENDANCE_SUPERVISOR_USERNAME:-attendance}
      ATTENDANCE_SUPERVISOR_NAME: ${ATTENDANCE_SUPERVISOR_NAME:-考勤主管}
      ATTENDANCE_SUPERVISOR_DEPARTMENT: ${ATTENDANCE_SUPERVISOR_DEPARTMENT:-组织人事部}
      ATTENDANCE_SUPERVISOR_PASSWORD: ${ATTENDANCE_SUPERVISOR_PASSWORD:?请在 .env 中设置 ATTENDANCE_SUPERVISOR_PASSWORD}
      CASE_USER_INITIAL_PASSWORD: ${CASE_USER_INITIAL_PASSWORD:-}
      RESET_CODE_MODE: ${RESET_CODE_MODE:-provider}
    ports:
      - "${APP_PORT:-8787}:8787"

volumes:
  cockpit_db:
